name: cityos-dx tests
on:
  push:
    paths: ['cityos-dx/**', '.github/workflows/cityos-dx-tests.yml']
  pull_request:
    paths: ['cityos-dx/**', '.github/workflows/cityos-dx-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cityos-dx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: openssl version
      - run: npm run test:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            cityos-dx/test-output/
            cityos-dx/docs/TEST_REPORT.md
